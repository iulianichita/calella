<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&display=swap" rel="stylesheet">
    <title>My Profile - calella</title>
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="dashboard.css">
</head>

<body class="dash">

    <header class="nav">
        <div class="container nav-inner">
        <a href="home.html" class="logo">calella</a>
        <nav class="nav-links">
            <a href="/learn">Learn</a>
            <a href="#events">Events</a>
            <a href="#new" class="btn btn-small btn-desktop-start">Start an event</a>
            <a href="/auth/logout" class="btn btn-small btn-mobile-logout">Disconnect</a>
            <a href="/auth/logout">Disconnect</a>
        </nav>
        </div>
    </header>

    <main class="container dash-main">
        <h1 id="greeting">Welcome</h1>
        <p class="subtitle" id="today"></p>

        <div class="grid grid-3 stats">
            <div class="card"><p class="label">Channels</p><h3 id="stat-channels">-</h3></div>
            <div class="card"><p class="label">Events</p><h3 id="stat-events">-</h3></div>
            <div class="card"><p class="label">Posts scheduled</p><h3 id="stat-posts">-</h3></div>
        </div>

        <h2 id="channels">Your Buffer channels</h2>
        <div class="grid grid-3" id="channels-list"></div>

        <h2 id="events">Your events</h2>
        <div class="grid grid-3" id="events-list"></div>

        <div id="event-modal" class="event-modal" hidden>
            <div class="event-modal-backdrop" data-close-modal="1"></div>
            <div class="event-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="event-modal-title">
                <button type="button" class="event-modal-close" id="modal-close" aria-label="Close">×</button>
                <div class="event-modal-head">
                    <h3 id="event-modal-title">Event post details</h3>
                    <p id="event-modal-counter" class="subtitle"></p>
                </div>
                <div class="event-modal-body">
                    <button type="button" class="event-modal-arrow" id="modal-prev" aria-label="Previous post">‹</button>
                    <div id="modal-slide" class="event-modal-slide"></div>
                    <button type="button" class="event-modal-arrow" id="modal-next" aria-label="Next post">›</button>
                </div>
            </div>
        </div>

        <h2 id="new">Start an event</h2>
        <form id="event-form" class="card form">
            <label>Event name<input name="name" required placeholder="Your next big event"></label>
            <label>Description<textarea name="description" rows="3" placeholder="You can say what is the event about and why should people attend."></textarea></label>
            <label>Template<select name="template" id="template"></select></label>
            <p class="subtitle" id="template-hint"></p>
            <fieldset>
                <legend>Poster design</legend>
                <div id="poster-picker" class="poster-picker"></div>
                <img id="poster-preview" class="poster-preview" alt="Poster preview" hidden>
            </fieldset>

            <div id="template-fields" class="grid grid-3"></div>

            <fieldset>
                <legend>Post on</legend>
                <div id="channel-checks"></div>
            </fieldset>

            <label>Hashtags (comma separated)<input name="tags" placeholder="event, community, 2027"></label>

            <button type="submit" class="btn btn-green" id="submit-btn">Create and schedule everything</button>
        </form>

        <div id="results" class="card" hidden></div>
    </main>

    <script src="dashboard.js"></script>
</body>
</html>
